<!DOCTYPE html>
<html lang="en">
<head>
  <title>Simple Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    header, footer {
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    main {
      padding: 20px;
    }
    img {
      width: 300px;
      border-radius: 10px;
    }
    button {
      padding: 10px 15px;
      margin-top: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <h2>Welcome to My Website</h2>
    <p>This is a simple webpage example using semantic HTML tags.</p>

    <h3>About Us</h3>
    <p>We create simple and modern web designs for beginners.</p>

    <img src="https://via.placeholder.com/300" alt="Sample Image">

    <br>
    <button>Click Me</button>
  </main>

  <!-- Footer -->
  <footer>
    <p>Contact: info@example.com</p>
    <p>&copy; 2026 My Website</p>
  </footer>

</body>
</html>
